name = "rss-feed"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Only serve via the custom domain that sits behind Cloudflare Access.
workers_dev = false
routes = [{ pattern = "rss.simbados.com", custom_domain = true }]

# Bundle the PNG app icons (src/icons/) as binary data: `import icon from './icons/x.png'` → ArrayBuffer.
[[rules]]
type = "Data"
globs = ["**/*.png"]
fallthrough = true

[triggers]
crons = ["*/30 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "rss-feed"
database_id = "6f7137b9-a6b9-4808-970f-772ddea13cdd"
migrations_dir = "migrations"

[vars]
# Zero Trust team domain, e.g. "myteam.cloudflareaccess.com"
ACCESS_TEAM_DOMAIN = "simbados.cloudflareaccess.com"
# "Application Audience (AUD) Tag" of the Access application
ACCESS_AUD = "f1345a103dc2cdea7c523b8a7ef21271f729119a4838d43539dafe1cd079f601"
# For local dev only, put DEV_NO_AUTH=1 into .dev.vars (never set it here).
# Web Push (daily summary). Generate keys with: node scripts/vapid-keys.mjs
# The public key goes here; the private key is the secret VAPID_PRIVATE_KEY (dashboard or `wrangler secret put`).
VAPID_PUBLIC_KEY = "BMScZHhIqaF4FbtBLD379yMoHri94HfBI_rEs_Y-aEQ23Yn1x9HWKcAE8Ppic_pjsDyN7Iv83RPn9zzf0BIEgWw"
# Contact for the push services (Apple requires an https: or mailto: URL).
VAPID_SUBJECT = "https://rss.simbados.com"

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

# Exposes the deployment's version id and timestamp (shown bottom left of every page).
[version_metadata]
binding = "CF_VERSION_METADATA"
